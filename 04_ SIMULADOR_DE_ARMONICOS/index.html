<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Simulador de Armónicos</title>


<!-- =========================================================
     ESTILOS

     1. estilos.css  → estándar común de los simuladores
     2. fourier.css  → estilos exclusivos de Fourier
     ========================================================= -->

<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/fourier.css">

</head>


<body>


<!-- =========================================================
     CONTENEDOR PRINCIPAL
     ========================================================= -->

<div class="simulador simulador-armonicos">


    <!-- =====================================================
         TÍTULO
         ===================================================== -->

    <div class="titulo-simulador">

        <h1>SIMULADOR DE ARMÓNICOS</h1>

        <p>
            Análisis en el dominio del tiempo y la frecuencia
        </p>

    </div>



    <!-- =====================================================
         ÁREA PRINCIPAL
         ===================================================== -->

    <div class="area-armonicos">


        <!-- =================================================
             ZONA IZQUIERDA — GRÁFICAS
             ================================================= -->

        <main class="zona-graficas">


            <!-- =================================================
                 1. AMPLITUD DE LOS ARMÓNICOS
                 ================================================= -->

            <section class="panel-grafica panel-amplitudes">


                <div class="titulo-grafica">
                    Amplitud de los armónicos
                </div>


                <!-- =============================================
                     VALORES A1 ... A11
                     ============================================= -->

                <div class="fila-amplitudes">


                    <div class="control-amplitud" data-armonico="1">

                        <label for="A1">
                            A<sub>1</sub>
                        </label>

                        <input
                            type="number"
                            id="A1"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="1.00">

                    </div>


                    <div class="control-amplitud" data-armonico="2">

                        <label for="A2">
                            A<sub>2</sub>
                        </label>

                        <input
                            type="number"
                            id="A2"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="3">

                        <label for="A3">
                            A<sub>3</sub>
                        </label>

                        <input
                            type="number"
                            id="A3"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="4">

                        <label for="A4">
                            A<sub>4</sub>
                        </label>

                        <input
                            type="number"
                            id="A4"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="5">

                        <label for="A5">
                            A<sub>5</sub>
                        </label>

                        <input
                            type="number"
                            id="A5"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="6">

                        <label for="A6">
                            A<sub>6</sub>
                        </label>

                        <input
                            type="number"
                            id="A6"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="7">

                        <label for="A7">
                            A<sub>7</sub>
                        </label>

                        <input
                            type="number"
                            id="A7"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="8">

                        <label for="A8">
                            A<sub>8</sub>
                        </label>

                        <input
                            type="number"
                            id="A8"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="9">

                        <label for="A9">
                            A<sub>9</sub>
                        </label>

                        <input
                            type="number"
                            id="A9"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="10">

                        <label for="A10">
                            A<sub>10</sub>
                        </label>

                        <input
                            type="number"
                            id="A10"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                    <div class="control-amplitud" data-armonico="11">

                        <label for="A11">
                            A<sub>11</sub>
                        </label>

                        <input
                            type="number"
                            id="A11"
                            min="-1"
                            max="1"
                            step="0.01"
                            value="0.00">

                    </div>


                </div>



                <!-- =============================================
                     GRÁFICA DE AMPLITUDES
                     ============================================= -->

                <div class="contenedor-grafica">


                    <svg
                        id="graficaAmplitudes"
                        viewBox="0 0 800 230">


                        <rect
                            x="0"
                            y="0"
                            width="800"
                            height="230"
                            class="fondo-grafica"/>


                        <g class="cuadricula">

                            <line x1="70" y1="25" x2="770" y2="25"/>
                            <line x1="70" y1="65" x2="770" y2="65"/>
                            <line x1="70" y1="105" x2="770" y2="105"/>
                            <line x1="70" y1="145" x2="770" y2="145"/>
                            <line x1="70" y1="185" x2="770" y2="185"/>

                            <line x1="105" y1="25" x2="105" y2="185"/>
                            <line x1="170" y1="25" x2="170" y2="185"/>
                            <line x1="235" y1="25" x2="235" y2="185"/>
                            <line x1="300" y1="25" x2="300" y2="185"/>
                            <line x1="365" y1="25" x2="365" y2="185"/>
                            <line x1="430" y1="25" x2="430" y2="185"/>
                            <line x1="495" y1="25" x2="495" y2="185"/>
                            <line x1="560" y1="25" x2="560" y2="185"/>
                            <line x1="625" y1="25" x2="625" y2="185"/>
                            <line x1="690" y1="25" x2="690" y2="185"/>
                            <line x1="755" y1="25" x2="755" y2="185"/>

                        </g>


                        <line
                            x1="70"
                            y1="25"
                            x2="70"
                            y2="185"
                            class="eje-grafica"/>


                        <line
                            x1="70"
                            y1="105"
                            x2="770"
                            y2="105"
                            class="eje-grafica"/>


                        <text
                            x="12"
                            y="18"
                            class="texto-eje">

                            Amplitud

                        </text>


                        <text x="52" y="30"
                              class="texto-eje">1</text>

                        <text x="48" y="70"
                              class="texto-eje">0.5</text>

                        <text x="55" y="110"
                              class="texto-eje">0</text>

                        <text x="43" y="150"
                              class="texto-eje">−0.5</text>

                        <text x="48" y="190"
                              class="texto-eje">−1</text>



                        <!-- =====================================
                             ETIQUETAS H1 ... H11
                             ===================================== -->

                        <text
                            x="98"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="1">H1</text>

                        <text
                            x="163"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="2">H2</text>

                        <text
                            x="228"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="3">H3</text>

                        <text
                            x="293"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="4">H4</text>

                        <text
                            x="358"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="5">H5</text>

                        <text
                            x="423"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="6">H6</text>

                        <text
                            x="488"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="7">H7</text>

                        <text
                            x="553"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="8">H8</text>

                        <text
                            x="618"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="9">H9</text>

                        <text
                            x="680"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="10">H10</text>

                        <text
                            x="745"
                            y="215"
                            class="texto-eje etiqueta-armonico"
                            data-armonico="11">H11</text>


                        <g id="barrasControlAmplitud"></g>


                    </svg>


                </div>


            </section>



            <!-- =================================================
                 2. ARMÓNICOS — DOMINIO DEL TIEMPO
                 ================================================= -->

            <section class="panel-grafica">


                <div class="titulo-grafica">
                    Armónicos — dominio del tiempo
                </div>


                <div class="fila-grafica">


                    <div class="contenedor-grafica">


                        <svg
                            id="graficaTiempo"
                            viewBox="0 0 800 250">


                            <rect
                                x="0"
                                y="0"
                                width="800"
                                height="250"
                                class="fondo-grafica"/>


                            <g class="cuadricula">

                                <line x1="70" y1="25" x2="770" y2="25"/>
                                <line x1="70" y1="75" x2="770" y2="75"/>
                                <line x1="70" y1="125" x2="770" y2="125"/>
                                <line x1="70" y1="175" x2="770" y2="175"/>
                                <line x1="70" y1="225" x2="770" y2="225"/>

                                <line x1="70" y1="25" x2="70" y2="225"/>
                                <line x1="157.5" y1="25" x2="157.5" y2="225"/>
                                <line x1="245" y1="25" x2="245" y2="225"/>
                                <line x1="332.5" y1="25" x2="332.5" y2="225"/>
                                <line x1="420" y1="25" x2="420" y2="225"/>
                                <line x1="507.5" y1="25" x2="507.5" y2="225"/>
                                <line x1="595" y1="25" x2="595" y2="225"/>
                                <line x1="682.5" y1="25" x2="682.5" y2="225"/>
                                <line x1="770" y1="25" x2="770" y2="225"/>

                            </g>


                            <line
                                x1="70"
                                y1="125"
                                x2="770"
                                y2="125"
                                class="eje-grafica"/>


                            <line
                                x1="420"
                                y1="25"
                                x2="420"
                                y2="225"
                                class="eje-grafica"/>


                            <text
                                x="12"
                                y="18"
                                class="texto-eje">

                                Amplitud

                            </text>


                            <text x="48" y="30"
                                  class="texto-eje">1</text>

                            <text x="42" y="80"
                                  class="texto-eje">0.5</text>

                            <text x="50" y="130"
                                  class="texto-eje">0</text>

                            <text x="36" y="180"
                                  class="texto-eje">−0.5</text>

                            <text x="42" y="230"
                                  class="texto-eje">−1</text>


                            <g id="etiquetasTiempo"></g>


                            <text
                                x="735"
                                y="150"
                                class="texto-eje">

                                t (ms)

                            </text>


                            <g id="componentesTiempo"></g>


                        </svg>


                    </div>



                    <!-- =========================================
                         ESCALA HORIZONTAL
                         ========================================= -->

                    <div class="controles-escala">


                        <div class="control-escala control-horizontal">


                            <button
                                id="tiempoXMenos"
                                class="boton-circular"
                                type="button"
                                title="Mostrar mayor intervalo de tiempo">

                                −

                            </button>


                            <button
                                id="tiempoXMas"
                                class="boton-circular"
                                type="button"
                                title="Mostrar menor intervalo de tiempo">

                                +

                            </button>


                        </div>


                    </div>


                </div>


            </section>



            <!-- =================================================
                 3. DOMINIO DE LA FRECUENCIA
                 ================================================= -->

            <section class="panel-grafica panel-frecuencia">


                <div class="titulo-grafica">
                    Dominio de la frecuencia
                </div>


                <div class="contenedor-grafica">


                    <svg
                        id="graficaFrecuencia"
                        viewBox="0 0 800 230">


                        <rect
                            x="0"
                            y="0"
                            width="800"
                            height="230"
                            class="fondo-grafica"/>


                        <g class="cuadricula">

                            <line x1="70" y1="45" x2="770" y2="45"/>
                            <line x1="70" y1="85" x2="770" y2="85"/>
                            <line x1="70" y1="125" x2="770" y2="125"/>
                            <line x1="70" y1="165" x2="770" y2="165"/>

                            <line x1="140" y1="25" x2="140" y2="185"/>
                            <line x1="210" y1="25" x2="210" y2="185"/>
                            <line x1="280" y1="25" x2="280" y2="185"/>
                            <line x1="350" y1="25" x2="350" y2="185"/>
                            <line x1="420" y1="25" x2="420" y2="185"/>
                            <line x1="490" y1="25" x2="490" y2="185"/>
                            <line x1="560" y1="25" x2="560" y2="185"/>
                            <line x1="630" y1="25" x2="630" y2="185"/>
                            <line x1="700" y1="25" x2="700" y2="185"/>

                        </g>


                        <line
                            x1="70"
                            y1="25"
                            x2="70"
                            y2="185"
                            class="eje-grafica"/>


                        <line
                            x1="70"
                            y1="185"
                            x2="770"
                            y2="185"
                            class="eje-grafica"/>


                        <text
                            x="15"
                            y="25"
                            class="texto-eje">

                            Amplitud

                        </text>


                        <text
                            x="735"
                            y="215"
                            class="texto-eje">

                            f (Hz)

                        </text>


                        <g id="barrasArmonicos"></g>


                    </svg>


                </div>


            </section>



            <!-- =================================================
                 4. SUMA DE ARMÓNICOS
                 ================================================= -->

            <section class="panel-grafica">


                <div class="titulo-grafica">
                    Suma de armónicos
                </div>


                <div class="fila-grafica">


                    <div class="contenedor-grafica">


                        <svg
                            id="graficaSuma"
                            viewBox="0 0 800 250">


                            <rect
                                x="0"
                                y="0"
                                width="800"
                                height="250"
                                class="fondo-grafica"/>


                            <g class="cuadricula">

                                <line x1="70" y1="25" x2="770" y2="25"/>
                                <line x1="70" y1="75" x2="770" y2="75"/>
                                <line x1="70" y1="125" x2="770" y2="125"/>
                                <line x1="70" y1="175" x2="770" y2="175"/>
                                <line x1="70" y1="225" x2="770" y2="225"/>

                                <line x1="70" y1="25" x2="70" y2="225"/>
                                <line x1="157.5" y1="25" x2="157.5" y2="225"/>
                                <line x1="245" y1="25" x2="245" y2="225"/>
                                <line x1="332.5" y1="25" x2="332.5" y2="225"/>
                                <line x1="420" y1="25" x2="420" y2="225"/>
                                <line x1="507.5" y1="25" x2="507.5" y2="225"/>
                                <line x1="595" y1="25" x2="595" y2="225"/>
                                <line x1="682.5" y1="25" x2="682.5" y2="225"/>
                                <line x1="770" y1="25" x2="770" y2="225"/>

                            </g>


                            <line
                                x1="70"
                                y1="125"
                                x2="770"
                                y2="125"
                                class="eje-grafica"/>


                            <line
                                x1="420"
                                y1="25"
                                x2="420"
                                y2="225"
                                class="eje-grafica"/>


                            <text
                                x="12"
                                y="18"
                                class="texto-eje">

                                Amplitud

                            </text>


                            <g id="etiquetasAmplitudSuma"></g>

                            <g id="etiquetasTiempoSuma"></g>


                            <text
                                x="735"
                                y="150"
                                class="texto-eje">

                                t (ms)

                            </text>


                            <path
                                id="ondaResultante"
                                d=""
                                class="onda-resultante"/>


                        </svg>


                    </div>



                    <!-- =========================================
                         ESCALA VERTICAL
                         ========================================= -->

                    <div class="controles-escala">


                        <div class="control-vertical">


                            <button
                                id="sumaYMas"
                                class="boton-circular"
                                type="button"
                                title="Ampliar escala de amplitud">

                                +

                            </button>


                            <div class="flecha-vertical">
                                ↕
                            </div>


                            <button
                                id="sumaYMenos"
                                class="boton-circular"
                                type="button"
                                title="Reducir escala de amplitud">

                                −

                            </button>


                        </div>


                    </div>


                </div>


            </section>


        </main>



        <!-- =================================================
             PANEL DERECHO DE CONTROLES
             ================================================= -->

        <aside class="zona-controles">


            <!-- =============================================
                 SEÑAL FUNDAMENTAL
                 ============================================= -->

            <fieldset class="panel-simulador">


                <legend>
                    Señal fundamental
                </legend>


                <div class="fila-control">


                    <label for="frecuenciaFundamental">
                        Frecuencia:
                    </label>


                    <select
                        id="frecuenciaFundamental"
                        class="selector-simulador">


                        <option value="50">
                            50 Hz
                        </option>


                        <option
                            value="60"
                            selected>

                            60 Hz

                        </option>


                    </select>


                </div>


            </fieldset>



            <!-- =============================================
                 ARMÓNICOS
                 ============================================= -->

            <fieldset class="panel-simulador">


                <legend>
                    Armónicos
                </legend>


                <div class="etiqueta-slider">


                    <span>
                        Número de armónicos:
                    </span>


                    <span id="valorArmonicos">
                        11
                    </span>


                </div>


                <div class="slider-simulador">


                    <input
                        type="range"
                        id="armonicos"
                        min="1"
                        max="11"
                        step="1"
                        value="11">


                    <div class="escala-slider">


                        <span>1</span>
                        <span>3</span>
                        <span>5</span>
                        <span>7</span>
                        <span>9</span>
                        <span>11</span>


                    </div>


                </div>


            </fieldset>



            <!-- =============================================
                 REPRESENTACIÓN
                 ============================================= -->

            <fieldset class="panel-simulador">


                <legend>
                    Representación
                </legend>


                <div class="fila-control">


                    <label for="representacion">
                        Mostrar:
                    </label>


                    <select
                        id="representacion"
                        class="selector-simulador">


                        <option value="ambos">
                            tiempo y frecuencia
                        </option>


                        <option value="tiempo">
                            tiempo
                        </option>


                        <option value="frecuencia">
                            frecuencia
                        </option>


                    </select>


                </div>


            </fieldset>



            <!-- =============================================
                 FUNCIÓN
                 ============================================= -->

            <fieldset class="panel-simulador">


                <legend>
                    Función
                </legend>


                <div class="grupo-horizontal">


                    <label class="opcion-radio">


                        <input
                            type="radio"
                            name="tipoFuncion"
                            value="seno"
                            checked>


                        <span>
                            senos
                        </span>


                    </label>


                    <label class="opcion-radio">


                        <input
                            type="radio"
                            name="tipoFuncion"
                            value="coseno">


                        <span>
                            cosenos
                        </span>


                    </label>


                </div>


            </fieldset>



            <!-- =============================================
                 REINICIAR
                 ============================================= -->

            <div class="zona-botones">


                <button
                    id="reiniciar"
                    class="boton-simulador"
                    type="button">

                    REINICIAR

                </button>


            </div>


        </aside>


    </div>


</div>



<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="js/simulador.js"></script>


</body>

</html>
